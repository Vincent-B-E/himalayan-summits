# Local DuckDB target. No credentials, so this is safe to keep in the repo.
#
# IMPORTANT: DuckDB resolves `path` relative to the directory you launch dbt
# from -- NOT relative to this file. Always run dbt from inside transform/ so
# that `../warehouse.duckdb` lands at the repo root (the same warehouse that
# ingest.py writes and notebooks/eda.py reads). Override with DBT_DUCKDB_PATH
# if you want the file elsewhere.
mountaineering:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../warehouse.duckdb') }}"
      schema: main
      threads: 4
